const BUILD = "2026-10-13 10:26";

const COLORS = ["#4f46e5","#0891b2","#059669","#d97706","#7c3aed","#db2777","#dc2626","#0d9488"];
const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function pad(x){return x<10?"0"+x:x;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function fmtDateHuman(isoDate){
  const [y,m,d] = isoDate.split("-").map(Number);
  return `${y}年${m}月${d}日 ${WEEK[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}`;
}
// 收录窗口
function fmtWindow(ws, we){
  if(!ws||!we) return "";
  const a = ws.slice(5,10).replace("-","月")+"日";
  const b = we.slice(5,10).replace("-","月")+"日";
  const days = Math.round((new Date(we) - new Date(ws))/86400000);
  return `收录窗口：${a} — ${b}（${days} 天 · 北京时间）`;
}
// ISO -> 北京时间人话 + 相对日期 + 距报告日天数
// 返回 {text, age}  age = 距报告日的天数（>=0 为窗口内，<0 表示未来日期）
function fmtTime(iso, refDate){
  if(!iso) return {text:"本期收录", age:null};
  const u = new Date(iso);
  if(isNaN(u)) return {text:"本期收录", age:null};
  const bj = new Date(u.getTime() + 8*3600*1000);          // 移到北京时间
  const h = bj.getUTCHours(), mi = bj.getUTCMinutes();
  const mon = bj.getUTCMonth()+1, day = bj.getUTCDate(), yr = bj.getUTCFullYear();
  const period = h<6?"凌晨":h<12?"上午":h<14?"中午":h<18?"下午":"晚上";
  let rel = "", age = null;
  if(refDate){
    const [ry,rm,rd] = refDate.split("-").map(Number);
    age = Math.round((Date.UTC(yr,mon-1,day) - Date.UTC(ry,rm-1,rd))/86400000);
    if(age===0) rel = "今天 ";
    else if(age===-1) rel = "昨天 ";
    else if(age===-2) rel = "前天 ";
  }
  return {text:`${rel}${mon}月${day}日 ${period}${h}:${pad(mi)}`, age};
}

  const b = document.createElement("div");
  b.className = "brief";
  b.innerHTML = `<h2>📌 本期主线</h2><ul>${DATA.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`;
  main.appendChild(b);
}

DATA.sections.forEach((s,i)=>{
  const c = COLORS[i%COLORS.length];
  const sec = document.createElement("section");
  sec.className="section"; sec.id="sec-"+i;
  const hint = s.hint ? `<span class="hint">${esc(s.hint)}</span>` : "";
  sec.innerHTML = `<div class="section-head"><span class="bar" style="background:${c}"></span>`
    + `<h2>${esc(s.label)}</h2><span class="count">${s.items.length} 条</span>${hint}</div>`;
  const grid = document.createElement("div");
  grid.className="grid";
  s.items.forEach(it=>{
    const t = fmtTime(it.publishedAt, DATA.date);
    const card = document.createElement("article");
    card.className="card"; card.id = "n" + it.n;
    card.dataset.search = [it.title, it.summary, it.sourceName, s.label].join(" ").toLowerCase();
    const ageBadge = (t.age===null||t.age===undefined) ? ""
      : `<span class="age ${t.age<=1?"fresh":"stale"}">${t.age<=0 ? "窗口内" : t.age+" 天前"}</span>`;
    card.innerHTML = `
      <div class="top">
        <a class="serial" style="background:${c}" href="#n${it.n}" title="本条永久链接">${it.n}</a>
        <span class="chip" title="${esc(it.sourceName)}"><span class="dot" style="background:${c}"></span>${esc(it.sourceName)}</span>
      </div>
      <h3><a href="${esc(it.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a></h3>
      <div class="meta"><span class="time">🕒 北京时间 ${esc(t.text)}</span>${ageBadge}</div>
      <p class="summary" title="${esc(it.summaryFull||it.summary)}">${esc(it.summary)}</p>
      <a class="read" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener noreferrer">查看原文 →</a>
    `;
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});

// 页脚
document.getElementById("foot-total").textContent = "共 " + total + " 条 · " + DATA.sections.length + " 个板块";
const src = document.getElementById("foot-source");
src.textContent = DATA.source || "AI HOT";
src.href = DATA.canonical || "#";
document.getElementById("foot-note").textContent =
  (DATA.footnote || "由 newspipe 生成") + " · " + BUILD;

// 导航高亮
const navLinks = Array.from(navInner.children);
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(a=>a.classList.toggle("active", a.dataset.sec===e.target.id));
    }
  });
},{rootMargin:"-45% 0px -50% 0px", threshold:0});
DATA.sections.forEach((_,i)=>{ const el=document.getElementById("sec-"+i); if(el) obs.observe(el); });

// ---- 搜索过滤（支持多关键词，空格分隔，全部命中） ----
const qEl = document.getElementById("q");
const emptyHit = document.getElementById("empty-hit");
const cards = Array.from(document.querySelectorAll(".card"));
const sections = Array.from(document.querySelectorAll(".section"));
qEl.addEventListener("input", ()=>{
  const terms = qEl.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let hits = 0;
  cards.forEach(card=>{
    const hay = card.dataset.search;
    const ok = terms.every(t=>hay.includes(t));
    card.style.display = ok ? "" : "none";
    if(ok) hits++;
  });
  sections.forEach(sec=>{
    const vis = Array.from(sec.querySelectorAll(".card")).filter(c=>c.style.display!=="none").length;
    sec.style.display = vis ? "" : "none";
    const cnt = sec.querySelector(".count");
    if(cnt) cnt.textContent = terms.length ? `${vis}/${sec.querySelectorAll(".card").length} 条` : `${sec.querySelectorAll(".card").length} 条`;
  });
  emptyHit.style.display = (terms.length && !hits) ? "block" : "none";
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
  else if(e.key==="Escape" && document.activeElement===qEl){ qEl.value=""; qEl.dispatchEvent(new Event("input")); qEl.blur(); }
});

// ---- 深色模式 ----
const themeBtn = document.getElementById("theme");
const saved = (()=>{ try{ return localStorage.getItem("news-theme"); }catch(_){ return null; } })();
function applyTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("news-theme", t); }catch(_){} }
if(saved) applyTheme(saved);
else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
themeBtn.addEventListener("click", ()=>{
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

// ---- 回到顶部 ----
const toTop = document.getElementById("to-top");
toTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll", ()=>{ toTop.classList.toggle("on", window.scrollY > 600); }, {passive:true});
</script>
</body>
</html>
