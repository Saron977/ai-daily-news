<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>__TITLE__</title>
<meta name="description" content="__DESC__"/>
<meta name="color-scheme" content="light dark"/>
<meta property="og:type" content="article"/>
<meta property="og:title" content="__TITLE__"/>
<meta property="og:description" content="__DESC__"/>
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e7e9f0; --soft:#f1f2f7; --body:#3a4252;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --radius:16px;
    --hero-a:#1e1b4b; --hero-b:#312e81; --hero-c:#4f46e5;
    --accent:#4f46e5; --link:#4f46e5;
    --nav-bg:rgba(255,255,255,.92); --mark:#fde68a;
  }
  html[data-theme="dark"]{
    --bg:#0e1117; --surface:#161b26; --ink:#e8ebf2; --muted:#9aa4b8;
    --line:#252c3b; --soft:#1d2431; --body:#c3cad9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --hero-a:#141a2e; --hero-b:#1b2340; --hero-c:#312e81;
    --accent:#6366f1; --link:#a5b4fc;
    --nav-bg:rgba(14,17,23,.9); --mark:#7c5c00;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}

  /* ===== Hero ===== */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 45%,var(--hero-c) 100%);
    color:#fff; padding:46px 0 38px;
  }
  .hero::after{
    content:""; position:absolute; right:-80px; top:-80px; width:340px; height:340px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
  }
  .hero .wrap{position:relative; z-index:1}
  .eyebrow{font-size:13px; letter-spacing:.18em; text-transform:uppercase; opacity:.82; margin:0 0 10px}
  .hero h1{margin:0; font-size:34px; font-weight:800; letter-spacing:.5px}
  .hero .sub{margin:8px 0 0; opacity:.9; font-size:15px}
  .total-badge{
    display:inline-flex; align-items:baseline; gap:8px; margin-top:18px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
    padding:8px 16px; border-radius:999px; font-size:14px;
  }
  .total-badge b{font-size:22px; font-weight:800}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:22px}
  .stat{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    border-radius:14px; padding:14px 12px; text-align:left; cursor:pointer;
    text-decoration:none; color:inherit; display:block; transition:.15s;
  }
  .stat:hover{background:rgba(255,255,255,.2)}
  .stat .num{font-size:26px; font-weight:800; line-height:1}
  .stat .lbl{font-size:12.5px; opacity:.9; margin-top:6px; min-height:34px}

  /* ===== Highlights ===== */
  .brief{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:var(--radius); padding:16px 20px; margin:22px 0 0; box-shadow:var(--shadow)}
  .brief h2{margin:0 0 8px; font-size:15px; font-weight:800; color:var(--ink)}
  .brief ul{margin:0; padding-left:20px}
  .brief li{font-size:14px; color:var(--body); margin:5px 0}

  /* ===== Sticky nav ===== */
  .nav{
    position:sticky; top:0; z-index:20; background:var(--nav-bg);
    backdrop-filter:saturate(180%) blur(10px); border-bottom:1px solid var(--line);
  }
  .nav .wrap{display:flex; gap:8px; overflow-x:auto; padding:10px 20px; align-items:center}
  .nav a.tab{
    flex:0 0 auto; text-decoration:none; font-size:13.5px; font-weight:600;
    color:var(--muted); padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    white-space:nowrap; transition:.15s;
  }
  .nav a.tab:hover{color:var(--ink); border-color:#c9cde0}
  .nav a.tab.active{color:#fff; background:var(--accent); border-color:var(--accent)}
  .nav a.tab .cnt{opacity:.7; font-weight:700; margin-left:4px}
  .nav .tools{margin-left:auto; display:flex; gap:6px; flex:0 0 auto}
  .nav input[type=search]{
    font:inherit; font-size:13px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); width:150px;
  }
  .nav input[type=search]:focus{outline:2px solid var(--accent); outline-offset:1px; width:190px}
  .nav button{
    font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:6px 11px;
    border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  }
  .nav button:hover{color:var(--ink); border-color:#c9cde0}

  /* ===== Sections ===== */
  main{padding:26px 0 10px}
  .section{margin-bottom:34px; scroll-margin-top:64px}
  .section-head{display:flex; align-items:center; gap:12px; margin:0 0 16px}
  .section-head .bar{width:6px; height:26px; border-radius:4px}
  .section-head h2{margin:0; font-size:21px; font-weight:800}
  .section-head .count{
    font-size:13px; color:var(--muted); background:var(--soft); padding:3px 10px; border-radius:999px; font-weight:700;
  }
  .section-head .hint{font-size:12.5px; color:var(--muted); margin-left:auto}

  /* ===== Cards grid ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px}
  .card{
    position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 18px 16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s;
    scroll-margin-top:70px;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 4px 8px rgba(16,24,40,.08),0 16px 36px rgba(16,24,40,.12)}
  .card:target{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent)}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px}
  .serial{
    font-size:13px; font-weight:800; color:#fff; min-width:30px; height:30px;
    border-radius:9px; display:inline-flex; align-items:center; justify-content:center; padding:0 8px;
    text-decoration:none; flex:0 0 auto;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px; max-width:100%;
    font-size:12px; font-weight:600; color:var(--muted);
    background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:4px 10px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
  .card h3{margin:2px 0 8px; font-size:16.5px; font-weight:700; line-height:1.4}
  .card h3 a{text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap}
  .meta .time{font-weight:600}
  .age{background:var(--soft); border-radius:999px; padding:1px 8px; font-weight:700}
  .age.fresh{color:#047857} html[data-theme="dark"] .age.fresh{color:#34d399}
  .age.stale{color:#b45309} html[data-theme="dark"] .age.stale{color:#fbbf24}
  .summary{font-size:14px; color:var(--body); margin:0 0 14px; flex:1}
  .read{
    align-self:flex-start; text-decoration:none; font-size:13.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:5px; color:var(--link);
  }
  .read:hover{gap:8px}
  .empty-hit{display:none; padding:40px 0; text-align:center; color:var(--muted)}
  mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 2px}

  /* ===== Footer ===== */
  footer{border-top:1px solid var(--line); margin-top:18px; padding:26px 0 50px; color:var(--muted); font-size:13.5px}
  footer .wrap{display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; justify-content:space-between}
  footer a{color:var(--link); text-decoration:none; font-weight:600}
  footer a:hover{text-decoration:underline}
  .foot-total{font-weight:800; color:var(--ink); font-size:15px}
  .to-top{position:fixed; right:18px; bottom:18px; z-index:30; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer;
    font-size:18px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.2s}
  .to-top.on{opacity:1; pointer-events:auto}

  @media (max-width:680px){
    .hero h1{font-size:27px}
    .grid{grid-template-columns:1fr}
    .nav .tools{margin-left:0}
    .nav input[type=search]{width:110px}
    .nav input[type=search]:focus{width:130px}
  }
  @media print{
    .nav,.to-top,.read{display:none!important}
    body{background:#fff}
    .card{break-inside:avoid; box-shadow:none; border-color:#ccc}
    .hero{background:#312e81!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="hero-eyebrow">AI HOT · 每日晨报</p>
      <h1 id="hero-date">—</h1>
      <p class="sub" id="hero-window">—</p>
      <div class="total-badge">本期共 <b id="hero-total">0</b> 条 AI 动态</div>
      <div class="stats" id="hero-stats"></div>
    </div>
  </header>

  <nav class="nav" id="nav">
    <div class="wrap">
      <div id="nav-inner" style="display:flex;gap:8px"></div>
      <div class="tools">
        <input type="search" id="q" placeholder="搜索…  (/)" aria-label="搜索本期条目"/>
        <button id="theme" type="button" title="切换深色模式">◐</button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div id="main"></div>
    <div class="empty-hit" id="empty-hit">没有匹配的条目</div>
  </main>

  <footer>
    <div class="wrap">
      <span class="foot-total" id="foot-total">共 0 条</span>
      <span>数据源：<a id="foot-source" href="#" target="_blank" rel="noopener noreferrer">AI HOT</a> · 时间均为北京时间</span>
      <span id="foot-note">—</span>
    </div>
  </footer>
  <button class="to-top" id="to-top" type="button" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
const DATA = __DATA__;
const BUILD = __BUILD__;

const COLORS = ["#4f46e5","#0891b2","#059669","#d97706","#7c3aed","#db2777","#dc2626","#0d9488"];
const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function pad(x){return x<10?"0"+x:x;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function fmtDateHuman(isoDate){
  const [y,m,d] = isoDate.split("-").map(Number);
  return `${y}年${m}月${d}日 ${WEEK[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}`;
}
// 收录窗口
function fmtWindow(ws, we){
  if(!ws||!we) return "";
  const a = ws.slice(5,10).replace("-","月")+"日";
  const b = we.slice(5,10).replace("-","月")+"日";
  const days = Math.round((new Date(we) - new Date(ws))/86400000);
  return `收录窗口：${a} — ${b}（${days} 天 · 北京时间）`;
}
// ISO -> 北京时间人话 + 相对日期 + 距报告日天数
// 返回 {text, age}  age = 距报告日的天数（>=0 为窗口内，<0 表示未来日期）
function fmtTime(iso, refDate){
  if(!iso) return {text:"本期收录", age:null};
  const u = new Date(iso);
  if(isNaN(u)) return {text:"本期收录", age:null};
  const bj = new Date(u.getTime() + 8*3600*1000);          // 移到北京时间
  const h = bj.getUTCHours(), mi = bj.getUTCMinutes();
  const mon = bj.getUTCMonth()+1, day = bj.getUTCDate(), yr = bj.getUTCFullYear();
  const period = h<6?"凌晨":h<12?"上午":h<14?"中午":h<18?"下午":"晚上";
  let rel = "", age = null;
  if(refDate){
    const [ry,rm,rd] = refDate.split("-").map(Number);
    age = Math.round((Date.UTC(yr,mon-1,day) - Date.UTC(ry,rm-1,rd))/86400000);
    if(age===0) rel = "今天 ";
    else if(age===-1) rel = "昨天 ";
    else if(age===-2) rel = "前天 ";
  }
  return {text:`${rel}${mon}月${day}日 ${period}${h}:${pad(mi)}`, age};
}

const total = DATA.sections.reduce((a,s)=>a+s.items.length,0);

document.getElementById("hero-eyebrow").textContent = (DATA.eyebrow || "AI HOT · 每日晨报");
document.getElementById("hero-date").textContent = fmtDateHuman(DATA.date) + " · " + (DATA.reportName || "AI 晨报");
document.getElementById("hero-window").textContent =
  (DATA.focusNote || "") + (DATA.focusNote ? "　|　" : "") + fmtWindow(DATA.windowStart, DATA.windowEnd);
document.getElementById("hero-total").textContent = String(total);
document.title = `${DATA.date} ${DATA.reportName || "AI 晨报"} · ${total} 条`;

// Hero 统计（可点击跳转）
const statsEl = document.getElementById("hero-stats");
DATA.sections.forEach((s,i)=>{
  const c = COLORS[i%COLORS.length];
  const a = document.createElement("a");
  a.className="stat"; a.href="#sec-"+i;
  a.innerHTML = `<div class="num" style="color:${c}">${s.items.length}</div><div class="lbl">${esc(s.label)}</div>`;
  statsEl.appendChild(a);
});

// 导航
const navInner = document.getElementById("nav-inner");
DATA.sections.forEach((s,i)=>{
  const a = document.createElement("a");
  a.className="tab"; a.href="#sec-"+i; a.dataset.sec="sec-"+i;
  a.innerHTML = `${esc(s.label)}<span class="cnt">${s.items.length}</span>`;
  navInner.appendChild(a);
});

// 正文
const main = document.getElementById("main");

// 本期主线
if(Array.isArray(DATA.highlights) && DATA.highlights.length){
  const b = document.createElement("div");
  b.className = "brief";
  b.innerHTML = `<h2>📌 本期主线</h2><ul>${DATA.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`;
  main.appendChild(b);
}

DATA.sections.forEach((s,i)=>{
  const c = COLORS[i%COLORS.length];
  const sec = document.createElement("section");
  sec.className="section"; sec.id="sec-"+i;
  const hint = s.hint ? `<span class="hint">${esc(s.hint)}</span>` : "";
  sec.innerHTML = `<div class="section-head"><span class="bar" style="background:${c}"></span>`
    + `<h2>${esc(s.label)}</h2><span class="count">${s.items.length} 条</span>${hint}</div>`;
  const grid = document.createElement("div");
  grid.className="grid";
  s.items.forEach(it=>{
    const t = fmtTime(it.publishedAt, DATA.date);
    const card = document.createElement("article");
    card.className="card"; card.id = "n" + it.n;
    card.dataset.search = [it.title, it.summary, it.sourceName, s.label].join(" ").toLowerCase();
    const ageBadge = (t.age===null||t.age===undefined) ? ""
      : `<span class="age ${t.age<=1?"fresh":"stale"}">${t.age<=0 ? "窗口内" : t.age+" 天前"}</span>`;
    card.innerHTML = `
      <div class="top">
        <a class="serial" style="background:${c}" href="#n${it.n}" title="本条永久链接">${it.n}</a>
        <span class="chip" title="${esc(it.sourceName)}"><span class="dot" style="background:${c}"></span>${esc(it.sourceName)}</span>
      </div>
      <h3><a href="${esc(it.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a></h3>
      <div class="meta"><span class="time">🕒 北京时间 ${esc(t.text)}</span>${ageBadge}</div>
      <p class="summary" title="${esc(it.summaryFull||it.summary)}">${esc(it.summary)}</p>
      <a class="read" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener noreferrer">查看原文 →</a>
    `;
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});

// 页脚
document.getElementById("foot-total").textContent = "共 " + total + " 条 · " + DATA.sections.length + " 个板块";
const src = document.getElementById("foot-source");
src.textContent = DATA.source || "AI HOT";
src.href = DATA.canonical || "#";
document.getElementById("foot-note").textContent =
  (DATA.footnote || "由 newspipe 生成") + " · " + BUILD;

// 导航高亮
const navLinks = Array.from(navInner.children);
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(a=>a.classList.toggle("active", a.dataset.sec===e.target.id));
    }
  });
},{rootMargin:"-45% 0px -50% 0px", threshold:0});
DATA.sections.forEach((_,i)=>{ const el=document.getElementById("sec-"+i); if(el) obs.observe(el); });

// ---- 搜索过滤（支持多关键词，空格分隔，全部命中） ----
const qEl = document.getElementById("q");
const emptyHit = document.getElementById("empty-hit");
const cards = Array.from(document.querySelectorAll(".card"));
const sections = Array.from(document.querySelectorAll(".section"));
qEl.addEventListener("input", ()=>{
  const terms = qEl.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let hits = 0;
  cards.forEach(card=>{
    const hay = card.dataset.search;
    const ok = terms.every(t=>hay.includes(t));
    card.style.display = ok ? "" : "none";
    if(ok) hits++;
  });
  sections.forEach(sec=>{
    const vis = Array.from(sec.querySelectorAll(".card")).filter(c=>c.style.display!=="none").length;
    sec.style.display = vis ? "" : "none";
    const cnt = sec.querySelector(".count");
    if(cnt) cnt.textContent = terms.length ? `${vis}/${sec.querySelectorAll(".card").length} 条` : `${sec.querySelectorAll(".card").length} 条`;
  });
  emptyHit.style.display = (terms.length && !hits) ? "block" : "none";
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
  else if(e.key==="Escape" && document.activeElement===qEl){ qEl.value=""; qEl.dispatchEvent(new Event("input")); qEl.blur(); }
});

// ---- 深色模式 ----
const themeBtn = document.getElementById("theme");
const saved = (()=>{ try{ return localStorage.getItem("news-theme"); }catch(_){ return null; } })();
function applyTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("news-theme", t); }catch(_){} }
if(saved) applyTheme(saved);
else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
themeBtn.addEventListener("click", ()=>{
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

// ---- 回到顶部 ----
const toTop = document.getElementById("to-top");
toTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll", ()=>{ toTop.classList.toggle("on", window.scrollY > 600); }, {passive:true});
</script>
</body>
</html>
